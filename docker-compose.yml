services:
  songtrace:
    # built here by default; set IMAGE_PREFIX (and IMAGE_TAG) to pull a
    # published image instead, see the README's quick start
    build: .
    image: ${IMAGE_PREFIX:-}songtrace:${IMAGE_TAG:-latest}
    ports:
      - "8000:8000"
    volumes:
      - ./config.toml:/config/config.toml:ro
      - ./data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
